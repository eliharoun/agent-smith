name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs when new commits arrive on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: bun test + vitest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Hermetic: never download an on-device embedding model from HuggingFace in
    # CI. Index builds stay lexical (BM25); the real-model path is exercised on
    # developer machines. Keeps the gauntlet fast, offline-safe, and immune to
    # HF availability.
    env:
      SMITH_NO_EMBEDDINGS: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node 20 (for GUI vitest suite)
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run bun test suite (CLI + core + io)
        run: bun test

      - name: Run vitest GUI suite
        working-directory: gui/web
        run: node node_modules/vitest/vitest.mjs run
